name: Tests

on:
  workflow_dispatch:
    inputs:
      kafka-channel:
        description: "Channel to use for the Kafka charm (broker and controller)"
        default: "4/edge"
        required: false
        type: choice
        options:
          - "4/edge"
          - "4/beta"
          - "4/candidate"
          - "4/stable"
  pull_request:
  workflow_call:
    inputs:
      kafka-channel:
        description: "Channel to use for the Kafka charm (broker and controller)"
        default: "4/edge"
        required: false
        type: string
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUJU_CHANNEL: "3.6/stable"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tox
        run: pipx install tox
      - name: Run linters
        run: tox run -e lint

  integration-test-terraform:
    strategy:
      fail-fast: false
      matrix:
        tox-environment:
          - integration-terraform
          - integration-terraform-cos
        kraft-mode:
          - single
          - multi
        juju:
          - snap_channel: "3.6/stable"
    runs-on: [self-hosted, linux, AMD64, X64, xlarge, noble]
    name: ${{ matrix.tox-environment }}_${{ matrix.kraft-mode }}_${{ matrix.juju.snap_channel }}
    needs:
      - lint
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup operator environment
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare -p k8s --extra-debs pipx

          pipx ensurepath
          pipx install tox poetry
      - name: Install terraform snap
        run: |
          sudo snap install terraform --channel=latest/stable --classic
      - name: Select tests
        id: select-tests
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]
          then
            echo Running unstable and stable tests
            echo "mark_expression=" >> $GITHUB_OUTPUT
          else
            echo Skipping unstable tests
            echo "mark_expression=not unstable" >> $GITHUB_OUTPUT
          fi
      - name: Run integration tests
        run: |
          tox run -e ${{ matrix.tox-environment }} -- -m '${{ steps.select-tests.outputs.mark_expression }}' --keep-models --kraft-mode=${{ matrix.kraft-mode }} --kafka-channel=${{ inputs.kafka-channel || '4/edge' }}
      - name: Setup tmate session
        uses: canonical/action-tmate@main
        if: ${{ failure() }}